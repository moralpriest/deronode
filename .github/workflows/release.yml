name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already tagged
        id: skip
        run: |
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump from conventional commits
        if: steps.skip.outputs.skip == 'false'
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            BASE="1.1.0"
            CURRENT_MAJOR=1
            CURRENT_MINOR=1
            CURRENT_PATCH=0
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            BASE=$(echo "$LAST_TAG" | sed 's/^v//')
            CURRENT_MAJOR=$(echo "$BASE" | cut -d. -f1)
            CURRENT_MINOR=$(echo "$BASE" | cut -d. -f2)
            CURRENT_PATCH=$(echo "$BASE" | cut -d. -f3)
            COMMITS=$(git log --pretty=format:"%s" "$LAST_TAG"..HEAD)
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major)
              NEW_MAJOR=$((CURRENT_MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$CURRENT_MAJOR
              NEW_MINOR=$((CURRENT_MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$CURRENT_MAJOR
              NEW_MINOR=$CURRENT_MINOR
              NEW_PATCH=$((CURRENT_PATCH + 1))
              ;;
          esac

          NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "current=$BASE" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Update version in node.sh
        if: steps.skip.outputs.skip == 'false'
        run: |
          sed -i "s/^DERONODE_VERSION=\"[^\"]*\"/DERONODE_VERSION=\"${{ steps.bump.outputs.new }}\"/" node.sh

      - name: Update version in node.ps1
        if: steps.skip.outputs.skip == 'false'
        run: |
          sed -i "s/^\$script:DeronodeVersion = '[^']*'/\$script:DeronodeVersion = '${{ steps.bump.outputs.new }}'/" node.ps1

      - name: Commit version bump
        if: steps.skip.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add node.sh node.ps1
          git commit -m "chore: release v${{ steps.bump.outputs.new }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.skip.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          name: v${{ steps.bump.outputs.new }}
          generate_release_notes: true
